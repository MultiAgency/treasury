name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every workspace package
        run: pnpm check && pnpm build

  stack:
    name: Stack tests (platform 1a7fe98, simulated)
    needs: checks
    runs-on: ubuntu-latest
    env:
      TREASURY_PLATFORM: ${{ github.workspace }}/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MultiAgency/platform
          # The commit @multiagency/sdk 0.4.0 was published from (tag sdk-v0.4.0); startStack checks it.
          ref: 1a7fe9818e2a83c548e1ba8d587f10acac37716a
          path: platform
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The platform's stack and its browser
        working-directory: platform
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: The owner UI on the stack
        run: pnpm --filter @treasury/web test:stack
