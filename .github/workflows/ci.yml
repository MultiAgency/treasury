name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Actions are pinned by commit, with the release they are in a comment.
jobs:
  checks:
    # Node 24 is the floor (package.json engines, and what the platform deploys on); 26 is the current LTS.
    name: Typecheck, unit tests and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm's version comes from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:sdk
      - name: Every workspace package
        run: pnpm check && pnpm build

  stack:
    # Unversioned, so branch protection needn't change at each platform pin.
    name: Stack tests (simulated platform)
    needs: checks
    runs-on: ubuntu-latest
    env:
      TREASURY_PLATFORM: ${{ github.workspace }}/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: MultiAgency/platform
          # Final combined SDK 0.5.9 offline-consumer handoff; sdk-pin.ts verifies source bytes and provenance.
          ref: 252cba1d1e6642a5ea9f42ea4927f982423ed8e1
          path: platform
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Only 24: the stack runs the platform, which deploys on node:24.22.0-slim (its Dockerfiles).
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The platform's stack, its confirm page and its browser
        working-directory: platform
        # The stack serves the platform's confirm page from web/dist but doesn't build it; unbuilt, /confirm/<token> answers 404.
        run: pnpm install --frozen-lockfile && pnpm exec rsbuild build --root web && pnpm exec playwright install --with-deps chromium
      - name: The app server on the stack
        run: pnpm --filter @treasury/server test:stack
      - name: The app's pages on the stack
        run: pnpm --filter @treasury/web test:stack
      - name: Frozen SDK compatibility and rollback gates
        run: pnpm test:compatibility
